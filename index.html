<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin / Gold – Price Ratio Chart</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #131722;
        }

        #chart-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* chart.js sets right and bottom, since only the chart knows how much room its axes take */
        #log-scale-toggle {
            position: absolute;
            /* the chart's canvases take 1 and 2, and it puts its own attribution logo at 3 */
            z-index: 3;
            box-sizing: border-box;
            width: 36px;
            height: 22px;
            padding: 0;
            border: 1px solid #2a2e39;
            border-radius: 3px;
            background-color: #1e222d;
            color: #b2b5be;
            font: 600 11px sans-serif;
            cursor: pointer;
            transition: color 0.12s, background-color 0.12s, border-color 0.12s, box-shadow 0.12s;
        }

        #log-scale-toggle:hover {
            border-color: #363a45;
            color: #d1d4dc;
        }

        /* aria-pressed carries the on/off state, so the active look needs no extra class */
        #log-scale-toggle[aria-pressed='true'] {
            border-color: #2962ff;
            background-color: #2962ff;
            box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.18);
            color: #ffffff;
        }

        /* the axes are on the right and bottom, so the container's top-left corner is also the plot's */
        #pair-legend {
            position: absolute;
            top: 12px;
            left: 12px;
            /* the chart draws on canvases at z-index 1 and 2, so 3 keeps the legend above them */
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 34px;
            /* 6px + the logo's 11px radius = the pill's 17px radius, which centers the logo in the round end */
            padding-left: 6px;
            /* less than the pill's 17px radius, because the empty round end already adds space after the text */
            padding-right: 12px;
            border-radius: 17px;
            background-color: #2a2e39;
            color: #d1d4dc;
            /* Lightweight Charts' default font family, so the name uses the same typeface as the axis labels */
            font: 20px -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
            /* mouse events pass through to the chart, so the crosshair, zoom and pan keep working over the legend */
            pointer-events: none;
        }

        /* flex drops the space that the line break between the two svgs would leave */
        .pair-logos {
            display: flex;
        }

        .pair-logos svg {
            width: 22px;
            height: 22px;
        }

        .pair-logos svg + svg {
            margin-left: -4px;
        }

        /* the first logo goes in front of the second, so it stays whole where they overlap */
        .pair-logos svg:first-child {
            /* the logos are flex items, which take z-index without position */
            z-index: 1;
            /* a round ring in the pill's color cuts into the second logo */
            border-radius: 50%;
            box-shadow: 0 0 0 2px #2a2e39;
        }
    </style>
</head>
<body>

    <div id="chart-container">
        <div id="pair-legend">
            <!-- screen readers skip the logos, since the text after them already names the pair -->
            <span class="pair-logos" aria-hidden="true">
                <!-- Bitcoin's logo, from the cryptocurrency-icons set (CC0: free to use without credit) -->
                <svg viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="16" fill="#f7931a"/>
                    <path fill="#ffffff" d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z"/>
                </svg>
                <!-- gold has no official logo: three stacked bars, drawn for this chart -->
                <svg viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="16" fill="#d4af37"/>
                    <path fill="#ffffff" d="M13 10.5h6l1.3 4.5h-8.6zM7.7 17h6l1.3 4.5H6.4zM18.3 17h6l1.3 4.5H17z"/>
                </svg>
            </span>
            Bitcoin / Gold
        </div>
        <button id="log-scale-toggle" type="button" aria-pressed="false">log</button>
    </div>

    <script type="module" src="/src/chart.js"></script>
</body>
</html>
